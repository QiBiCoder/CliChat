  <script>
    (function() {
      try {
        var origFetch = typeof window !== 'undefined' ? window.fetch : null;
        var currentFetch = origFetch;
        var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                   (typeof Window !== 'undefined' && Object.getOwnPropertyDescriptor(Window.prototype, 'fetch'));
        if (!desc || !desc.set || desc.writable === false) {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        }
      } catch (e) {
        /* Ignore if already defined */
      }
    })();
  </script>
